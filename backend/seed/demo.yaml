# Demo data for local development and the quickstart scenarios (quickstart.md).
# `python -m app.seed --demo` upserts it; listing ids are derived from (leaf, index), so
# re-running updates rows instead of duplicating them. Photos are placeholders: the
# storage keys do not exist, so pages show the image fallback (Principle VI).

users:
  - {phone: "+255700000001", name: Asha Mushi, language: sw}            # renter
  - {phone: "+255700000002", name: Baraka Mollel, language: sw}         # owner (individual)
  - {phone: "+255700000003", name: Neema Kweka, language: en}           # owner (business)
  - {phone: "+255700000009", name: Admin, language: en, is_admin: true}

owners:
  - phone: "+255700000002"
    kind: individual
    display_name: Baraka Homes & Rides
    nida_number: "19900101-12345-00001-23"
    payout: {kind: mobile_money, network: mpesa, msisdn: "+255700000002", account_name: Baraka Mollel}
  - phone: "+255700000003"
    kind: business
    display_name: Kweka Event Hire Ltd
    business_name: Kweka Event Hire Limited
    brela_reg_no: "154321"
    tin: "123-456-789"
    payout: {kind: mobile_money, network: airtel, msisdn: "+255780000003", account_name: Kweka Event Hire Ltd}

# Launch cities → district/ward slugs from seed/locations.csv.
cities:
  dar: {region: dar-es-salaam, district: kinondoni, ward: msasani, lat: -6.7488, lng: 39.2762}
  arusha: {region: arusha, district: arusha-city, ward: sekei, lat: -3.3667, lng: 36.6833}
  dodoma: {region: dodoma, district: dodoma-city, ward: makole, lat: -6.1731, lng: 35.7419}
  mwanza: {region: mwanza, district: nyamagana, ward: isamilo, lat: -2.5090, lng: 32.9030}
  zanzibar: {region: mjini-magharibi, district: mjini, ward: shangani, lat: -6.1617, lng: 39.1866}

x-slots: &slots {open: "08:00", close: "22:00", slot_minutes: 60, days: [1, 2, 3, 4, 5, 6, 7]}

