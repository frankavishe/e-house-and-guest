          - *with_driver
          - *air_conditioning
      - slug: motorbikes
        name: {sw: Pikipiki, en: Motorbikes}
        booking_mode: DATE_RANGE
        price_units: [day, week]
        default_unit: day
        sort_order: 4
        attribute_schema:
          - key: engine_cc
            type: integer
            label: {sw: Ukubwa wa injini, en: Engine size}
