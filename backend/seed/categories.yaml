# Seed categories (contracts/attribute-schema.md "Seed categories").
# Six top-level groups; leaves carry the booking mode, price units and attribute schema.
# `python -m app.seed --categories` upserts by slug and bumps schema_version on change.
# Keys under `x-fields` are YAML anchors reused below; the seeder ignores them.

x-fields:
  amenities_stay: &amenities_stay
    key: amenities
    type: multi_enum
    label: {sw: Huduma, en: Amenities}
    filter: any_of
    order: 50
    options:
      - {value: wifi, label: {sw: Intaneti (Wi-Fi), en: Wi-Fi}}
      - {value: parking, label: {sw: Maegesho, en: Parking}}
      - {value: ac, label: {sw: Kiyoyozi, en: Air conditioning}}
      - {value: kitchen, label: {sw: Jiko, en: Kitchen}}
      - {value: tv, label: {sw: Televisheni, en: TV}}
      - {value: generator, label: {sw: Jenereta, en: Backup generator}}
      - {value: security, label: {sw: Ulinzi saa 24, en: 24h security}}
      - {value: pool, label: {sw: Bwawa la kuogelea, en: Swimming pool}}
      - {value: laundry, label: {sw: Huduma ya kufua, en: Laundry}}
      - {value: water_tank, label: {sw: Tanki la maji, en: Water storage tank}}
  bedrooms: &bedrooms
    key: bedrooms
    type: integer
    label: {sw: Vyumba vya kulala, en: Bedrooms}
    required: true
    min: 0
    max: 50
    filter: range
    show_on_card: true
    order: 1
  bathrooms: &bathrooms
    key: bathrooms
    type: integer
    label: {sw: Mabafu, en: Bathrooms}
    min: 0
    max: 50
    filter: range
    order: 2
  max_guests: &max_guests
    key: max_guests
    type: integer
    label: {sw: Idadi ya wageni, en: Maximum guests}
    required: true
    min: 1
    max: 200
    filter: range
    show_on_card: true
    order: 3
  furnished: &furnished
    key: furnished
    type: boolean
    label: {sw: Ina samani, en: Furnished}
    filter: exact
    order: 10
  capacity: &capacity
    key: capacity
    type: integer
    label: {sw: Uwezo (watu), en: Capacity (people)}
    required: true
    min: 1
    max: 20000
    filter: range
    show_on_card: true
    order: 1
  area_m2: &area_m2
    key: area_m2
    type: decimal
    label: {sw: Ukubwa, en: Size}
    unit: {sw: m², en: m²}
    required: true
    min: 1
    max: 1000000
    filter: range
    show_on_card: true
    order: 1
  security_24h: &security_24h
    key: security_24h
    type: boolean
    label: {sw: Ulinzi saa 24, en: 24h security}
    filter: exact
    order: 20
  seats: &seats
    key: seats
    type: integer
    label: {sw: Viti, en: Seats}
    required: true
    min: 1
    max: 100
    filter: range
    show_on_card: true
    order: 2
  transmission: &transmission
    key: transmission
    type: enum
    label: {sw: Gia, en: Transmission}
    filter: exact
    order: 3
    options:
      - {value: manual, label: {sw: Manual, en: Manual}}
      - {value: automatic, label: {sw: Automatiki, en: Automatic}}
  fuel_type: &fuel_type
    key: fuel_type
    type: enum
    label: {sw: Aina ya mafuta, en: Fuel type}
    filter: any_of
    order: 4
    options:
      - {value: petrol, label: {sw: Petroli, en: Petrol}}
      - {value: diesel, label: {sw: Dizeli, en: Diesel}}
      - {value: electric, label: {sw: Umeme, en: Electric}}
      - {value: hybrid, label: {sw: Mseto, en: Hybrid}}
  with_driver: &with_driver
    key: with_driver
    type: boolean
    label: {sw: Pamoja na dereva, en: With driver}
    filter: exact
    show_on_card: true
    order: 5
  condition: &condition
    key: condition
    type: enum
    label: {sw: Hali, en: Condition}
    filter: any_of
    order: 30
    options:
      - {value: new, label: {sw: Mpya, en: New}}
      - {value: good, label: {sw: Nzuri, en: Good}}
      - {value: fair, label: {sw: Wastani, en: Fair}}
  setup_included: &setup_included
    key: setup_included
    type: boolean
    label: {sw: Kufunga kumejumuishwa, en: Setup included}
    filter: exact
    order: 20
  operator_included: &operator_included
    key: operator_included
    type: boolean
    label: {sw: Pamoja na mwendeshaji, en: Operator included}
    filter: exact
    order: 21
  power_watts: &power_watts
    key: power_watts
    type: integer
    label: {sw: Nguvu, en: Power}
    unit: {sw: W, en: W}
    min: 1
    max: 100000
    filter: range
    order: 5

groups:
  - slug: accommodation
    name: {sw: Malazi, en: Accommodation}
    sort_order: 1
    children:
      - slug: rooms
        name: {sw: Vyumba, en: Rooms}
        booking_mode: DATE_RANGE
        price_units: [night, week, month]
        default_unit: night
        sort_order: 1
        attribute_schema:
          - *bedrooms
          - *bathrooms
          - *max_guests
          - *furnished
          - key: private_bathroom
            type: boolean
            label: {sw: Bafu binafsi, en: Private bathroom}
            filter: exact
            order: 11
          - *amenities_stay
      - slug: guest-houses
        name: {sw: Nyumba za wageni, en: Guest houses}
        booking_mode: DATE_RANGE
        price_units: [night, week, month]
        default_unit: night
        sort_order: 2
        attribute_schema:
          - *bedrooms
          - *bathrooms
          - *max_guests
          - key: breakfast_included
            type: boolean
            label: {sw: Kifungua kinywa kimejumuishwa, en: Breakfast included}
            filter: exact
            show_on_card: true
            order: 12
          - *amenities_stay
      - slug: serviced-apartments
        name: {sw: Apartment zenye huduma, en: Serviced apartments}
        booking_mode: DATE_RANGE
        price_units: [night, week, month]
        default_unit: night
        sort_order: 3
        attribute_schema:
          - *bedrooms
          - *bathrooms
          - *max_guests
          - key: housekeeping
            type: enum
            label: {sw: Usafi wa nyumba, en: Housekeeping}
            filter: exact
            order: 12
            options:
              - {value: daily, label: {sw: Kila siku, en: Daily}}
              - {value: weekly, label: {sw: Kila wiki, en: Weekly}}
              - {value: none, label: {sw: Hakuna, en: None}}
          - *amenities_stay
      - slug: student-housing
        name: {sw: Hosteli za wanafunzi, en: Student housing}
        booking_mode: LEASE
        price_units: [month]
        default_unit: month
        sort_order: 4
        attribute_schema:
          - key: room_type
            type: enum
            label: {sw: Aina ya chumba, en: Room type}
            required: true
            filter: any_of
            show_on_card: true
            order: 1
            options:
              - {value: single, label: {sw: Mtu mmoja, en: Single}}
              - {value: shared, label: {sw: Cha kushirikiana, en: Shared}}
          - key: gender
            type: enum
            label: {sw: Jinsia, en: Gender}
            required: true
            filter: exact
            show_on_card: true
            order: 2
            options:
              - {value: male, label: {sw: Wanaume, en: Male}}
              - {value: female, label: {sw: Wanawake, en: Female}}
              - {value: mixed, label: {sw: Mchanganyiko, en: Mixed}}
          - key: near_institution
            type: text
            label: {sw: Karibu na chuo, en: Near institution}
            max_length: 120
            order: 3
          - key: meals_included
            type: boolean
            label: {sw: Chakula kimejumuishwa, en: Meals included}
            filter: exact
            order: 4
          - *amenities_stay
      - slug: co-living
        name: {sw: Makazi ya pamoja, en: Co-living}
        booking_mode: LEASE
        price_units: [month]
        default_unit: month
        sort_order: 5
        attribute_schema:
          - *bedrooms
          - *furnished
          - key: residents
            type: integer
            label: {sw: Wakazi wengine, en: Other residents}
            min: 0
            max: 50
            filter: range
            order: 3
          - *amenities_stay

  - slug: workspace
    name: {sw: Sehemu za kazi, en: Workspace}
    sort_order: 2
    children:
      - slug: coworking
        name: {sw: Sehemu za kazi za pamoja, en: Coworking}
        booking_mode: TIME_SLOT
        price_units: [hour, day]
        default_unit: hour
        sort_order: 1
        attribute_schema:
          - key: desk_type
            type: enum
            label: {sw: Aina ya meza, en: Desk type}
            required: true
            filter: any_of
            show_on_card: true
            order: 1
            options:
              - {value: hot_desk, label: {sw: Meza ya pamoja, en: Hot desk}}
              - {value: dedicated_desk, label: {sw: Meza binafsi, en: Dedicated desk}}
              - {value: private_office, label: {sw: Ofisi binafsi, en: Private office}}
              - {value: meeting_room, label: {sw: Chumba cha mikutano, en: Meeting room}}
          - *seats
          - key: amenities
            type: multi_enum
            label: {sw: Huduma, en: Amenities}
            filter: any_of
            order: 50
            options:
              - {value: wifi, label: {sw: Intaneti (Wi-Fi), en: Wi-Fi}}
              - {value: ac, label: {sw: Kiyoyozi, en: Air conditioning}}
              - {value: printing, label: {sw: Uchapishaji, en: Printing}}
              - {value: projector, label: {sw: Projekta, en: Projector}}
              - {value: coffee, label: {sw: Kahawa na chai, en: Coffee and tea}}
              - {value: parking, label: {sw: Maegesho, en: Parking}}
              - {value: generator, label: {sw: Jenereta, en: Backup generator}}
      - slug: offices
        name: {sw: Ofisi, en: Offices}
        booking_mode: LEASE
        price_units: [month]
        default_unit: month
        sort_order: 2
        attribute_schema:
          - *area_m2
          - key: rooms
            type: integer
            label: {sw: Vyumba, en: Rooms}
            min: 1
            max: 200
            filter: range
            show_on_card: true
            order: 2
          - *furnished
          - key: floor
            type: integer
            label: {sw: Ghorofa, en: Floor}
            min: 0
            max: 100
            filter: range
            order: 3
          - key: amenities
            type: multi_enum
            label: {sw: Huduma, en: Amenities}
            filter: any_of
            order: 50
            options:
              - {value: parking, label: {sw: Maegesho, en: Parking}}
              - {value: ac, label: {sw: Kiyoyozi, en: Air conditioning}}
              - {value: elevator, label: {sw: Lifti, en: Elevator}}
              - {value: generator, label: {sw: Jenereta, en: Backup generator}}
              - {value: security, label: {sw: Ulinzi saa 24, en: 24h security}}
              - {value: internet, label: {sw: Intaneti, en: Internet}}
              - {value: reception, label: {sw: Mapokezi, en: Reception}}

  - slug: venues
    name: {sw: Kumbi na maeneo ya matukio, en: Venues}
    sort_order: 3
    children:
      - slug: event-halls
