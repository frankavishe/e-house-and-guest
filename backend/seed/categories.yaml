            min: 1
            max: 50
            filter: range
            order: 2
          - key: loading_bay
            type: boolean
            label: {sw: Sehemu ya kupakia malori, en: Truck loading bay}
            filter: exact
            show_on_card: true
            order: 3
          - key: three_phase_power
            type: boolean
            label: {sw: Umeme wa njia tatu, en: Three-phase power}
            filter: exact
            order: 4
          - *security_24h
      - slug: self-storage
        name: {sw: Hifadhi binafsi, en: Self storage}
