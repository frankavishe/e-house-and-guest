      - slug: vans
        name: {sw: Van, en: Vans}
        booking_mode: DATE_RANGE
        price_units: [day, week]
        default_unit: day
        sort_order: 2
        attribute_schema:
          - key: vehicle_type
            type: enum
            label: {sw: Aina ya gari, en: Vehicle type}
            required: true
            filter: any_of
            show_on_card: true
            order: 1
            options:
              - {value: minivan, label: {sw: Minivan, en: Minivan}}
              - {value: cargo_van, label: {sw: Van ya mizigo, en: Cargo van}}
              - {value: safari_van, label: {sw: Van ya safari, en: Safari van}}
