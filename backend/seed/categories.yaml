          - *transmission
          - *fuel_type
          - *with_driver
          - *air_conditioning
      - slug: buses
        name: {sw: Mabasi, en: Buses}
        booking_mode: DATE_RANGE
        price_units: [day, week]
        default_unit: day
        sort_order: 3
        attribute_schema:
          - key: vehicle_type
            type: enum
            label: {sw: Aina ya basi, en: Bus type}
            required: true
            filter: any_of
            show_on_card: true
            order: 1
            options:
              - {value: minibus, label: {sw: Daladala/Coaster, en: Minibus}}
