      - slug: parking
        name: {sw: Maegesho, en: Parking}
        booking_mode: DATE_RANGE
        price_units: [day, month]
        default_unit: day
        sort_order: 3
        attribute_schema:
          - key: vehicle_size
            type: multi_enum
            label: {sw: Aina ya chombo, en: Vehicle size}
            required: true
            filter: any_of
            show_on_card: true
            order: 1
            options:
              - {value: motorbike, label: {sw: Pikipiki, en: Motorbike}}
              - {value: car, label: {sw: Gari dogo, en: Car}}
              - {value: van, label: {sw: Van, en: Van}}
              - {value: truck, label: {sw: Lori, en: Truck}}
          - key: covered
            type: boolean
            label: {sw: Yenye paa, en: Covered}
            filter: exact
            order: 2
          - *security_24h

  - slug: vehicles
    name: {sw: Magari na usafiri, en: Vehicles & mobility}
    sort_order: 5
    children:
      - slug: cars
        name: {sw: Magari madogo, en: Cars}
