            order: 2
            options:
              - {value: garden, label: {sw: Bustani, en: Garden}}
              - {value: beach, label: {sw: Ufukweni, en: Beach}}
              - {value: rooftop, label: {sw: Juu ya jengo, en: Rooftop}}
              - {value: open_ground, label: {sw: Uwanja wa wazi, en: Open ground}}
          - *venue_amenities

  - slug: storage-property
    name: {sw: Hifadhi na mali, en: Storage & property}
    sort_order: 4
    children:
      - slug: warehouses
        name: {sw: Maghala, en: Warehouses}
        booking_mode: LEASE
        price_units: [month]
        default_unit: month
        sort_order: 1
        attribute_schema:
          - *area_m2
          - key: ceiling_height_m
