              - {value: sound_system, label: {sw: Mfumo wa sauti, en: Sound system}}
              - {value: stage, label: {sw: Jukwaa, en: Stage}}
              - {value: parking, label: {sw: Maegesho, en: Parking}}
              - {value: catering, label: {sw: Huduma ya chakula, en: Catering}}
              - {value: decor, label: {sw: Mapambo, en: Decoration}}
              - {value: ac, label: {sw: Kiyoyozi, en: Air conditioning}}
              - {value: generator, label: {sw: Jenereta, en: Backup generator}}
      - slug: event-venues
        name: {sw: Maeneo ya matukio ya wazi, en: Outdoor event venues}
        booking_mode: TIME_SLOT
        price_units: [hour, day]
        default_unit: day
        sort_order: 2
        attribute_schema:
          - *capacity
          - key: venue_type
            type: enum
            label: {sw: Aina ya eneo, en: Venue type}
            required: true
            filter: any_of
